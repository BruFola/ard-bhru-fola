# This workflow runs when CI passes on master, or manually
name: Continuous Deployment to Azure Web App Workflow

on: 

  workflow_run:
     workflows: ["CI for Ard Bhru Fola"]
     types: [completed] 
     branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: ardbhrufola  # The Apps name


 
  
jobs:

    
     Build:
   
    
      runs-on: ubuntu-latest
      if: ( github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository )|| github.event_name == 'workflow_dispatch'  # only run if the CI workflow was successful, from a push in this repo, or manually triggered
      permissions:
       contents: read
      steps:
  
      - name: 'Checkout Repository'
        uses: actions/checkout@v4 # Part of Github - no need for pinning 
        with: 
           ref: ${{ github.event.workflow_run.head_sha }}
       
      - name: Setup .NET
        uses: actions/setup-dotnet@v4 # Part of Github - no need for pinning 
        with:
           dotnet-version: '10.0.x'

      - name: Publish
        run:  dotnet publish BPCalculator/BPCalculator.csproj --configuration Release --output ./publish # publish only the BP Calculator project to the publish folder
      
      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # V7.0.2  https://github.com/actions/upload-artifact/commit/cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
         name: publish
         path: ./publish
    
     Deploy-Quality:
      needs: Build
      runs-on: ubuntu-latest
      permissions:
        contents: read
      steps:
       - name: Download Artifact
         uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # V8.0.2 https://github.com/actions/download-artifact/commit/9000827ccba6bdab643e8b6fd33ac0654aef8333
         with:
          name: publish
          path: ./publish

       - name: Deploy to Quality Slot
         uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8 https://github.com/Azure/webapps-deploy/commit/02a81bead70021f5284939794bcec79c271ab383
         with:
          app-name :  ${{env.AZURE_WEBAPP_NAME }}
          slot-name : quality
          publish-profile: ${{secrets.AZURE_PUBLISH_PROFILE_QUALITY }}
          package: ./publish


     E2E-Testing:
      permissions: 
        contents: read
      needs: Deploy-Quality
      runs-on: ubuntu-latest
      
      steps:
        - name: 'Checkout Repository'
          uses: actions/checkout@v4 # Part of Github - no need for pinning 
          with: 
           ref: ${{ github.event.workflow_run.head_sha }}
       
        - name: Setup .NET
          uses: actions/setup-dotnet@v4 # Part of Github - no need for pinning 
          with:
           dotnet-version: '10.0.x'

        - name: Build E2E Tests
          run: dotnet build BPCalculator.E2E --configuration Release

        - name: Install Playwright browsers
          run: pwsh BPCalculator.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

        - name: Run E2E tests against Quality
          env:
            BASE_URL: https://ardbhrufola-quality-e3hqe9bgevaxcgak.spaincentral-01.azurewebsites.net/
          run: dotnet test BPCalculator.E2E --no-build --configuration Release


     Deploy-Staging:
         needs: E2E-Testing
         runs-on: ubuntu-latest
         permissions:
          contents: read
         steps:
         - name: Download Artifact
           uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # V8.0.2 https://github.com/actions/download-artifact/commit/9000827ccba6bdab643e8b6fd33ac0654aef8333
           with:
            name: publish
            path: ./publish

         - name: Deploy to Staging Slot
           uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383  # v3.0.8 https://github.com/Azure/webapps-deploy/commit/02a81bead70021f5284939794bcec79c271ab383
           with:
            app-name :  ${{env.AZURE_WEBAPP_NAME }}
            slot-name : staging
            publish-profile: ${{secrets.AZURE_PUBLISH_PROFILE_STAGING}}
            package: ./publish
   
     Swap-Production:
          needs: Deploy-Staging
          environment: production
          runs-on: ubuntu-latest
          permissions:
            id-token: write
            contents: read 

          steps:
          - name: Azure Login ( using OIDC )
            uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
            with:
              client-id: ${{ secrets.AZURE_CLIENT_ID }}
              tenant-id: ${{ secrets.AZURE_TENANT_ID }}
              subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

          - name: Swap Staging to Production
            run: az webapp deployment slot swap -g Silo -n ardbhrufola --slot staging --target-slot production

      
                 

  