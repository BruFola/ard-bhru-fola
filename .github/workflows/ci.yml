name: CI for Ard Bhru Fola
on:
  push:
    branches: 
      - master
    
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with code coverage
        run:  dotnet test --no-build --configuration Release --settings codecoverage.runsettings --collect:"XPlat Code Coverage"