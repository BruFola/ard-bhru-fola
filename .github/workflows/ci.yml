name: CI for Ard Bhru Fola
on:
  push:
    branches: 
      - master
    
  pull_request:
    branches:
      - master

  workflow_dispatch:


   
jobs:
 
  dependency-review:
    if: github.event_name == 'pull_request'  
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with: 
          fail-on-severity: high


  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Sonar Scanner Start
        run: |
               dotnet tool install --global dotnet-sonarscanner
               dotnet sonarscanner begin
               /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="${{ secrets.SONAR_TOKEN }}" /d:sonar.organization="ard-bhru-fola" /d:sonar.projectKey="BruFola_ard-bhru-fola" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
        
      - name: Restore dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Security Check for DotNet Dependencies
        run: |
              dotnet list package --vulnerable --include-transitive 2>&1 | tee build.log
              if grep -q "has the following vulnerable packages" build.log; then
                 echo "Security Vulnerabilities found on the log output" && exit 1
              fi 


      - name: Run tests with code coverage
        run:  dotnet test --no-build --configuration Release --settings codecoverage.runsettings --collect:"XPlat Code Coverage"

      - name: Sonar Scanner End
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Code Coverage Report with thresold set to 80 to fail if below 
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
         filename: /BPCalculator.Tests/**/coverage.cobertura.xml
         badge: true
         fail_below_min: true
         format: markdown
         hide_branch_rate: false
         hide_complexity: true
         indicators: true
         output: both
         thresholds: '80'