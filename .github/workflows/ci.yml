name: CI for Ard Bhru Fola
on:
  push:
    branches: 
      - master
    
  pull_request:
    branches:
      - master

  workflow_dispatch:


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Security Check for DotNet Dependencies
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee build.log
             grep -q -i "critical\|high\|moderate\|low" build.log; [ $? -eq 0 ] && echo "Security Vulnerabilities found on the log output" && exit 1


      - name: Run tests with code coverage
        run:  dotnet test --no-build --configuration Release --settings codecoverage.runsettings --collect:"XPlat Code Coverage"

      - name: Code Coverage Report with thresold set to 80 to fail if below 
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
         filename: /BPCalculator.Tests/**/coverage.cobertura.xml
         badge: true
         fail_below_min: true
         format: markdown
         hide_branch_rate: false
         hide_complexity: true
         indicators: true
         output: both
         thresholds: '80'